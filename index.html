<title>Topo Nederland</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;700;800&display=swap">
<style>
/* Layout: kaart (zee, provincies in atlaskleuren) met onderaan of rechts een spelpaneel; zoomen en slepen op de kaart. */
:root {
  --bg: #e9f0f5;
  --panel: #ffffff;
  --ink: #15304a;
  --muted: #587086;
  --line: #c6d6e2;
  --sea: #cfe4f2;
  --lake: var(--sea);
  --land-n: #e2e6e2;
  --edge: #15304a;
  --c-yellow: #f4cf3a;
  --c-green: #8fb43a;
  --c-orange: #f0903a;
  --c-purple: #a65a9a;
  --river: #3b82c4;
  --river-ink: #1b4f86;
  --vel-a: #d6d12e; --vel-b: #6b4a1d;
  --ach-a: #b9b463; --ach-b: #6f6a2a;
  --bet-a: #8aa0a0; --bet-b: #d6e2e2;
  --rnd-b: #2f5f1e;
  --mark: #d6246e;
  --ok: #17935a;
  --bad: #d13a3a;
  --accent: #1d5fd1;
  --accent-ink: #ffffff;
  --soft: #eef4f9;
  --halo: rgba(255, 255, 255, 0.85);
  --font-display: "Fredoka", "Trebuchet MS", system-ui, sans-serif;
  --font-body: "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1924;
    --panel: #152636;
    --ink: #e6f0f8;
    --muted: #8fa9bd;
    --line: #29415a;
    --sea: #12324a;
    --land-n: #212f39;
    --edge: #0b1621;
    --c-yellow: #cfaa2b;
    --c-green: #729634;
    --c-orange: #c9722d;
    --c-purple: #8c4d82;
    --river: #5aa4e6;
    --river-ink: #9fd0ff;
    --vel-a: #a8a424; --vel-b: #3f2c0e;
    --ach-a: #8a8648; --ach-b: #4f4b1c;
    --bet-a: #62797a; --bet-b: #a5b8b8;
    --rnd-b: #0f2d08;
    --mark: #ff5c9c;
    --ok: #3ccf8b;
    --bad: #ff7676;
    --accent: #6b97ff;
    --accent-ink: #0b1626;
    --soft: #1c3145;
    --halo: rgba(13, 25, 36, 0.85);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1924;
  --panel: #152636;
  --ink: #e6f0f8;
  --muted: #8fa9bd;
  --line: #29415a;
  --sea: #12324a;
  --land-n: #212f39;
  --edge: #0b1621;
  --c-yellow: #cfaa2b;
  --c-green: #729634;
  --c-orange: #c9722d;
  --c-purple: #8c4d82;
  --river: #5aa4e6;
  --river-ink: #9fd0ff;
  --vel-a: #a8a424; --vel-b: #3f2c0e;
  --ach-a: #8a8648; --ach-b: #4f4b1c;
  --bet-a: #62797a; --bet-b: #a5b8b8;
  --rnd-b: #0f2d08;
  --mark: #ff5c9c;
  --ok: #3ccf8b;
  --bad: #ff7676;
  --accent: #6b97ff;
  --accent-ink: #0b1626;
  --soft: #1c3145;
  --halo: rgba(13, 25, 36, 0.85);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.4;
  padding-block: 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

#app { height: 100%; display: grid; grid-template-rows: auto minmax(0, 1fr); gap: 8px; padding-block: 8px; }
header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
header h1 { margin: 0; font-family: var(--font-display); font-weight: 700; font-size: 24px; letter-spacing: 0.01em; }
header span { color: var(--muted); font-size: 13px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; }

main { display: grid; gap: 10px; grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) auto; min-height: 0; }
@media (min-width: 880px) {
  main { grid-template-columns: minmax(0, 1fr) 400px; grid-template-rows: minmax(0, 1fr); }
  .panel { max-height: 100%; }
}

.mapcard { position: relative; min-height: 200px; min-width: 0; border-radius: 14px; overflow: hidden; background: var(--sea); border: 1px solid var(--line); }
svg#map { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; user-select: none; -webkit-user-select: none; cursor: grab; }
svg#map.panning { cursor: grabbing; }
.zoom { position: absolute; right: 10px; bottom: 10px; display: flex; flex-direction: column; gap: 6px; }
.zoom button { width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); display: grid; place-items: center; font-family: var(--font-display); font-size: 22px; font-weight: 600; line-height: 1; padding: 0; }
.zoom button:hover { background: var(--soft); }

.panel { min-width: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px; overflow-y: auto; max-height: 50vh; }
.screen[hidden] { display: none; }
.label { margin: 0 0 6px; font-size: 12px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.stack { display: grid; gap: 14px; }

.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1.5px solid var(--line); background: transparent; border-radius: 999px; padding: 6px 12px; font-weight: 700; font-size: 14px; display: inline-flex; gap: 6px; align-items: center; }
.chip small { color: var(--muted); font-weight: 700; font-size: 12px; }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.chip[aria-pressed="true"] small { color: inherit; opacity: 0.8; }

.modes { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.mode { border: 1.5px solid var(--line); background: var(--soft); border-radius: 12px; padding: 10px 8px 9px; text-align: left; display: grid; gap: 4px; align-content: start; }
.mode svg { width: 26px; height: 26px; stroke: var(--accent); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.mode b { font-family: var(--font-display); font-weight: 600; font-size: 15px; line-height: 1.15; }
.mode span { font-size: 12px; color: var(--muted); line-height: 1.25; }
.mode:hover { border-color: var(--accent); }
.mode:disabled { opacity: 0.45; cursor: not-allowed; }

.row { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.seg { display: inline-flex; border: 1.5px solid var(--line); border-radius: 999px; overflow: hidden; }
.seg button { border: 0; background: transparent; padding: 6px 14px; font-weight: 800; font-size: 14px; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--panel); }

.top { display: flex; align-items: center; gap: 10px; font-size: 13px; font-weight: 800; color: var(--muted); }
.bar { flex: 1; height: 8px; background: var(--soft); border-radius: 999px; overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: var(--accent); border-radius: 999px; transition: width 0.3s; }
.kind { margin-top: 12px; font-size: 12px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: var(--mark); }
.prompt { font-family: var(--font-display); font-weight: 600; font-size: 30px; line-height: 1.1; text-wrap: balance; overflow-wrap: anywhere; margin: 2px 0 2px; }
.sub { color: var(--muted); font-size: 14px; margin: 0; }
.fb { min-height: 44px; margin-top: 8px; font-weight: 700; font-size: 16px; }
.fb.ok { color: var(--ok); }
.fb.bad { color: var(--bad); }
.fb.near { color: var(--mark); }
.actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
.btn { border: 0; background: var(--accent); color: var(--accent-ink); border-radius: 10px; padding: 10px 18px; font-weight: 800; font-size: 15px; }
.btn.ghost { background: transparent; color: var(--ink); border: 1.5px solid var(--line); }
.btn[hidden] { display: none; }
.btn:hover { filter: brightness(1.07); }

#tform { display: flex; gap: 8px; margin-top: 10px; }
#tform input { flex: 1; min-width: 0; border: 2px solid var(--line); background: var(--soft); border-radius: 10px; padding: 10px 12px; font-size: 18px; font-weight: 700; }
#tform input:focus { border-color: var(--accent); outline: none; }
#tform[hidden] { display: none; }
.hint { font-family: ui-monospace, Menlo, Consolas, monospace; letter-spacing: 0.08em; color: var(--muted); font-size: 16px; min-height: 22px; margin-top: 6px; overflow-wrap: anywhere; }

.link { border: 0; background: transparent; color: var(--muted); font-weight: 800; font-size: 13px; text-decoration: underline; padding: 2px 4px; }
.hist { list-style: none; margin: 6px 0 0; padding: 0; display: grid; gap: 4px; }
.hist li { display: flex; align-items: baseline; gap: 10px; background: var(--soft); border-radius: 8px; padding: 6px 10px; font-size: 13px; }
.hist b { font-family: var(--font-display); font-size: 17px; font-weight: 600; min-width: 52px; font-variant-numeric: tabular-nums; }
.hist span { color: var(--muted); font-weight: 700; min-width: 0; overflow-wrap: anywhere; }
.hist em { margin-left: auto; font-style: normal; color: var(--muted); font-size: 12px; white-space: nowrap; }
.score { display: flex; align-items: center; gap: 14px; }
.big { font-family: var(--font-display); font-size: 44px; font-weight: 700; line-height: 1; }
.stars { display: flex; gap: 4px; }
.stars svg { width: 30px; height: 30px; fill: var(--line); }
.stars svg.on { fill: var(--c-yellow); stroke: var(--ink); stroke-width: 1; }
.missed { display: flex; flex-wrap: wrap; gap: 6px; margin: 0; padding: 0; list-style: none; }
.missed li { background: var(--soft); border-radius: 8px; padding: 4px 10px; font-weight: 700; font-size: 14px; }
.missed li small { color: var(--muted); font-weight: 700; }

.info { border-radius: 12px; background: var(--soft); padding: 12px 14px; min-height: 68px; }
.info b { font-family: var(--font-display); font-size: 26px; font-weight: 600; display: block; line-height: 1.15; overflow-wrap: anywhere; }
.info span { color: var(--muted); font-size: 13px; font-weight: 700; }
.check { display: flex; align-items: center; gap: 8px; font-weight: 700; }
.check input { width: 20px; height: 20px; accent-color: var(--accent); }

/* ---------- kaart ---------- */
#sea-bg { fill: var(--sea); }
.nb { fill: var(--land-n); stroke: var(--land-n); stroke-width: 0.6; }
.prov { stroke: var(--edge); stroke-width: 1px; vector-effect: non-scaling-stroke; stroke-linejoin: round; transition: opacity 0.2s; }
.prov.yellow { fill: var(--c-yellow); }
.prov.green { fill: var(--c-green); }
.prov.orange { fill: var(--c-orange); }
.prov.purple { fill: var(--c-purple); }
.prov.is-target { stroke: var(--mark); stroke-width: 4px; }
.prov.is-ok { stroke: var(--ok); stroke-width: 4px; }
.prov.is-bad { stroke: var(--bad); stroke-width: 4px; }
svg.dim .prov:not(.is-target):not(.is-ok):not(.is-bad) { opacity: 0.4; }
.sea { fill: transparent; stroke: none; }
.dam { fill: none; stroke: var(--edge); stroke-width: 2px; vector-effect: non-scaling-stroke; stroke-linecap: round; pointer-events: none; }
.lakecol { fill: var(--lake); pointer-events: none; }
.sea.lake { fill: var(--lake); stroke: transparent; stroke-width: 14px; vector-effect: non-scaling-stroke; }
.sea.is-target { fill: var(--mark); fill-opacity: 0.3; stroke: var(--mark); stroke-width: 2px; stroke-dasharray: 6 4; vector-effect: non-scaling-stroke; }
.sea.is-ok { fill: var(--ok); fill-opacity: 0.3; }
.sea.is-bad { fill: var(--bad); fill-opacity: 0.3; }
.w-hit { fill: none; stroke: transparent; stroke-width: 26px; vector-effect: non-scaling-stroke; stroke-linecap: round; stroke-linejoin: round; }
.w-vis { fill: none; stroke: var(--river); stroke-linecap: round; stroke-linejoin: round; }
.ctx { pointer-events: none; }
.w-hl { fill: none; stroke: var(--mark); stroke-linecap: round; stroke-linejoin: round; opacity: 0; transition: opacity 0.15s; }
.wt.is-target .w-hl { opacity: 0.9; }
.wt.is-ok .w-hl { stroke: var(--ok); opacity: 0.9; }
.wt.is-bad .w-hl { stroke: var(--bad); opacity: 0.9; }
.wt.est.is-target .w-hl, .wt.est.is-ok .w-hl, .wt.est.is-bad .w-hl { opacity: 0.55; }
.area { fill: transparent; stroke: none; }
.area.is-explore { fill: var(--ink); fill-opacity: 0.08; stroke: var(--ink); stroke-opacity: 0.55; stroke-width: 1.5px; stroke-dasharray: 5 4; vector-effect: non-scaling-stroke; }
.area.is-target { fill: var(--mark); fill-opacity: 0.28; stroke: var(--mark); stroke-width: 3px; stroke-dasharray: 6 4; vector-effect: non-scaling-stroke; }
.area.is-ok { fill: var(--ok); fill-opacity: 0.28; stroke: var(--ok); stroke-width: 3px; stroke-dasharray: 6 4; vector-effect: non-scaling-stroke; }
.area.is-bad { fill: var(--bad); fill-opacity: 0.28; stroke: var(--bad); stroke-width: 3px; stroke-dasharray: 6 4; vector-effect: non-scaling-stroke; }
.pa-vel { fill: var(--vel-a); } .pb-vel { fill: var(--vel-b); }
.pa-ach { fill: var(--ach-a); } .pb-ach { fill: var(--ach-b); }
.pa-bet { fill: var(--bet-a); } .pb-bet { fill: var(--bet-b); }
.pb-rnd { fill: var(--rnd-b); }
.area[data-id="a-veluwe"].is-explore, .area[data-id="a-veluwe"].is-target, .area[data-id="a-veluwe"].is-ok, .area[data-id="a-veluwe"].is-bad { fill: url(#pat-vel); fill-opacity: 1; }
.area[data-id="a-achterhoek"].is-explore, .area[data-id="a-achterhoek"].is-target, .area[data-id="a-achterhoek"].is-ok, .area[data-id="a-achterhoek"].is-bad { fill: url(#pat-ach); fill-opacity: 1; }
.area[data-id="a-betuwe"].is-explore, .area[data-id="a-betuwe"].is-target, .area[data-id="a-betuwe"].is-ok, .area[data-id="a-betuwe"].is-bad { fill: url(#pat-bet); fill-opacity: 1; }
.area[data-id="a-randstad"].is-explore, .area[data-id="a-randstad"].is-target, .area[data-id="a-randstad"].is-ok, .area[data-id="a-randstad"].is-bad { fill: url(#pat-rnd); fill-opacity: 1; }
.area.is-explore { stroke-dasharray: none; stroke-width: 1px; }
.pb-gen { fill: var(--ink); fill-opacity: 0.42; }
.area[data-pat="h"].is-explore { fill: url(#pat-gen-h); fill-opacity: 1; }
.area[data-pat="v"].is-explore { fill: url(#pat-gen-v); fill-opacity: 1; }
.area[data-pat="d"].is-explore { fill: url(#pat-gen-d); fill-opacity: 1; }
.dvis { fill: #ffffff; stroke: var(--bad); stroke-width: 2.5px; vector-effect: non-scaling-stroke; }
.dhit { fill: transparent; }
.dring { fill: none; stroke: var(--mark); stroke-width: 2.5px; vector-effect: non-scaling-stroke; opacity: 0; transform-box: fill-box; transform-origin: center; }
.dot.is-target .dvis { fill: var(--mark); stroke: #fff; }
.dot.is-target .dring { animation: ring 1.3s ease-out infinite; }
.dot.is-ok .dvis { fill: var(--ok); stroke: #fff; }
.dot.is-bad .dvis { fill: var(--bad); stroke: #fff; }
.dot.is-pick .dvis { fill: var(--ink); }
@keyframes ring { 0% { opacity: 0.9; transform: scale(0.5); } 100% { opacity: 0; transform: scale(2.2); } }
@media (prefers-reduced-motion: reduce) { .dot.is-target .dring { animation: none; opacity: 0.6; } .bar i, .prov { transition: none; } }

.lbl { display: none; pointer-events: none; font-family: var(--font-body); font-weight: 800; fill: var(--ink); paint-order: stroke; stroke: var(--halo); stroke-width: calc(var(--u, 1) * 3.5px); stroke-linejoin: round; font-size: calc(var(--u, 1) * 12px); }
.lbl.l-prov { font-size: calc(var(--u, 1) * 12.5px); letter-spacing: 0.02em; }
.lbl.l-water { fill: var(--river-ink); font-style: italic; }
.lbl.l-area { font-size: calc(var(--u, 1) * 13px); text-transform: uppercase; letter-spacing: 0.08em; }

/* aanklikbaar per vraagsoort */
svg [data-id], svg [data-id] * { pointer-events: none; }
svg[data-hit~="prov"] .k-prov { pointer-events: all; cursor: pointer; }
svg[data-hit~="water"] .k-water.sea { pointer-events: all; cursor: pointer; }
svg[data-hit~="water"] .k-water .w-hit { pointer-events: stroke; cursor: pointer; }
svg[data-hit~="cap"] .k-cap .dhit { pointer-events: all; cursor: pointer; }
svg[data-hit~="place"] .k-place .dhit { pointer-events: all; cursor: pointer; }
svg[data-hit~="area"] .k-area { pointer-events: all; cursor: pointer; }
@media (hover: hover) {
  svg[data-hit~="prov"] .k-prov:hover:not(.is-target):not(.is-ok):not(.is-bad) { filter: brightness(1.1); }
}
</style>

<div id="app">
  <header>
    <h1>Topo Nederland</h1>
    <span>Groep 6</span>
  </header>
  <main>
    <section class="mapcard" id="mapcard" aria-label="Kaart van Nederland">
      <svg id="map" role="img" aria-label="Kaart van Nederland met provincies, hoofdsteden en wateren" preserveAspectRatio="xMidYMid meet" data-hit=""></svg>
      <div class="zoom">
        <button type="button" id="zin" aria-label="Inzoomen">+</button>
        <button type="button" id="zout" aria-label="Uitzoomen">&minus;</button>
        <button type="button" id="zreset" aria-label="Hele kaart">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8V3h5M17 8V3h-5M3 12v5h5M17 12v5h-5"/></svg>
        </button>
      </div>
    </section>

    <section class="panel" id="panel">
      <!-- instellen -->
      <div class="screen stack" id="s-setup">
        <div>
          <p class="label">Wat wil je oefenen?</p>
          <div class="chips" id="chips"></div>
        </div>
        <div>
          <p class="label">Hoe wil je oefenen?</p>
          <div class="modes">
            <button type="button" class="mode" data-mode="explore">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 11V5a2 2 0 0 1 4 0v5l5 1.2a2 2 0 0 1 1.5 2L19 18a3 3 0 0 1-3 3h-4a3 3 0 0 1-2.4-1.2L6 15.5a1.6 1.6 0 0 1 2.4-2L9 14"/></svg>
              <b>Leer de kaart</b><span>Tik en lees de naam</span>
            </button>
            <button type="button" class="mode" data-mode="find">
              <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21"/></svg>
              <b>Zoek op de kaart</b><span>Tik waar het ligt</span>
            </button>
            <button type="button" class="mode" data-mode="type">
              <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2.5" y="6" width="19" height="12" rx="2.5"/><path d="M6.5 10h.01M10 10h.01M13.5 10h.01M17 10h.01M7 14h10"/></svg>
              <b>Typ de naam</b><span>Hoe heet dit?</span>
            </button>
          </div>
        </div>
        <div id="hist-wrap" hidden>
          <div class="row"><p class="label" style="margin:0">Eerdere rondes</p><button type="button" class="link" id="hclear">Wissen</button></div>
          <ul class="hist" id="hist"></ul>
        </div>
      </div>

      <!-- leren -->
      <div class="screen stack" id="s-explore" hidden>
        <div class="info" id="xinfo" aria-live="polite"><b>Tik op de kaart</b><span>Je ziet hier hoe het heet.</span></div>
        <label class="check"><input type="checkbox" id="xlabels"> Alle namen op de kaart tonen</label>
        <div class="actions" style="margin:0"><button type="button" class="btn" id="xdone">Klaar</button></div>
      </div>

      <!-- spelen -->
      <div class="screen" id="s-play" hidden>
        <div class="top"><span id="pcount">Vraag 1 van 10</span><div class="bar"><i id="pbar"></i></div><span id="pscore">0 goed</span></div>
        <div class="kind" id="pkind">Provincie</div>
        <div class="prompt" id="pprompt">Friesland</div>
        <p class="sub" id="psub">Tik op de kaart waar het ligt.</p>
        <form id="tform" autocomplete="off" hidden>
          <input id="tin" type="text" inputmode="text" autocapitalize="words" autocorrect="off" spellcheck="false" aria-label="Typ de naam" placeholder="Typ de naam">
          <button type="submit" class="btn" id="tgo">Controleer</button>
        </form>
        <div class="hint" id="thint" aria-live="polite"></div>
        <div class="fb" id="pfb" role="status" aria-live="polite"></div>
        <div class="actions">
          <button type="button" class="btn" id="bnext" hidden>Volgende</button>
          <button type="button" class="btn ghost" id="bhint" hidden>Hint</button>
          <button type="button" class="btn ghost" id="bstop">Stoppen</button>
        </div>
      </div>

      <!-- resultaat -->
      <div class="screen stack" id="s-result" hidden>
        <div class="score">
          <div class="big" id="rbig">8/10</div>
          <div>

    clearMarks(); setDots({}, null); svg.setAttribute("data-hit", "");
    logRound();
    var n = S.queue.length, g = S.good, pct = n ? g / n : 0;
    $("#rbig").textContent = g + "/" + n;
    var stars = pct >= 0.9 ? 3 : pct >= 0.7 ? 2 : pct >= 0.4 ? 1 : 0;
    var sh = "";
    for (var i = 0; i < 3; i++) sh += '<svg viewBox="0 0 24 24" class="' + (i < stars ? "on" : "") + '"><path d="M12 2.5l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.3 6.1 20.6l1.3-6.6L2.5 9.4l6.6-.8z" stroke-linejoin="round"/></svg>';
    $("#rstars").innerHTML = sh;
    $("#rmsg").textContent = pct >= 0.9 ? "Wauw, bijna alles goed!" : pct >= 0.7 ? "Goed gedaan! Nog even de fouten oefenen." : pct >= 0.4 ? "Een goed begin. Oefen de fouten en probeer opnieuw." : "Blijf oefenen, het gaat steeds beter.";
    var ul = $("#rmissed"); ul.innerHTML = "";
    S.missed.forEach(function (it) { var li = document.createElement("li"); li.innerHTML = it.name + " <small>" + KIND_NL[it.kind].toLowerCase() + "</small>"; ul.appendChild(li); });
    $("#rmissed-wrap").hidden = !S.missed.length;
    $("#rfix").hidden = !S.missed.length;
    show("result");
    resetView();
  }
  $("#rfix").onclick = function () { var m = S.missed.slice(), mode = S.mode; startSession(mode, m); };
  $("#ragain").onclick = function () { var mode = S.mode; startSession(mode, null); };
  $("#rback").onclick = function () { S = null; leaveGame(); };

  document.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && S && S.done && !$("#s-play").hidden && document.activeElement !== $("#bnext")) { $("#bnext").click(); }
  });

  /* ---------- start ---------- */
  show("setup");
  renderHist();
  setAreasExplore(selAreas());
  applyView();
})();
</script>
